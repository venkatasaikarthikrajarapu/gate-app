services:
  postgres:
    image: postgres:16-alpine
    container_name: gate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gateuser
      POSTGRES_PASSWORD: gatepass
      POSTGRES_DB: gatedb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateuser -d gatedb"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
